[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "med-ontology-lookup"
version = "0.1.2"
description = "Lookup medical terms in RadLex, SNOMED-CT, FMA, LOINC, and UMLS via BioPortal and UMLS REST APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "med-ontology-lookup contributors" }]
keywords = ["medical", "ontology", "snomed", "radlex", "umls", "fma", "bioportal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[project.scripts]
molu = "med_ontology_lookup.cli:app"

[project.urls]
Homepage = "https://github.com/openimagingdata/med-ontology-lookup"
Documentation = "https://github.com/openimagingdata/med-ontology-lookup#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/med_ontology_lookup"]

[tool.hatch.build.targets.sdist]
include = ["src/med_ontology_lookup", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
