version: "3"

tasks:
  default:
    desc: Run the standard offline checks
    cmds:
      - task: check

  check:
    desc: Check the lockfile, formatting, lint, types, and tests
    cmds:
      - task: lock
      - task: format-check
      - task: lint
      - task: typecheck
      - task: test

  lock:
    desc: Verify that uv.lock matches pyproject.toml
    cmd: uv lock --check

  format-check:
    desc: Check formatting without changing files
    cmd: uv run --locked ruff format --check .

  lint:
    desc: Run Ruff lint checks
    cmd: uv run --locked ruff check .

  typecheck:
    desc: Run the pinned ty type checker
    cmd: uv run --locked ty check

  test:
    desc: Run the offline test suite
    cmd: uv run --locked pytest -q

  fix:
    desc: Apply safe Ruff lint fixes and formatting
    cmds:
      - uv run --locked ruff check . --fix
      - uv run --locked ruff format .

  test-matrix:
    desc: Run tests in isolated environments on every supported Python version
    cmds:
      - uv run --locked --isolated --python 3.11 pytest -q
      - uv run --locked --isolated --python 3.12 pytest -q
      - uv run --locked --isolated --python 3.13 pytest -q
      - uv run --locked --isolated --python 3.14 pytest -q

  build:
    desc: Build the wheel and source distribution
    cmd: uv build

  verify:
    desc: Run standard checks, the Python matrix, and package builds
    cmds:
      - task: check
      - task: test-matrix
      - task: build
