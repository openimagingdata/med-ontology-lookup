version: "3"

tasks:
  default:
    desc: Run the standard offline checks
    cmds:
      - task: check

  check:
    desc: Check the lockfile, formatting, lint, types, and tests
    cmds:
      - task: static
      - task: test

  static:
    desc: Check the lockfile, formatting, lint, and types
    cmds:
      - task: lock
      - task: format-check
      - task: lint
      - task: typecheck

  lock:
    desc: Verify that uv.lock matches pyproject.toml
    cmd: uv lock --check

  format-check:
    desc: Check formatting without changing files
    cmd: uv run --locked ruff format --check .

  lint:
    desc: Run Ruff lint checks
    cmd: uv run --locked ruff check .

  typecheck:
    desc: Run the pinned ty type checker
    cmd: uv run --locked ty check

  test:
    desc: Run the offline test suite
    cmd: uv run --locked pytest -q

  fix:
    desc: Apply safe Ruff lint fixes and formatting
    cmds:
      - uv run --locked ruff check . --fix
      - uv run --locked ruff format .

  test-matrix:
    desc: Run tests in isolated environments on every supported Python version
    cmds:
      - uv run --locked --isolated --python 3.11 pytest -q
      - uv run --locked --isolated --python 3.12 pytest -q
      - uv run --locked --isolated --python 3.13 pytest -q
      - uv run --locked --isolated --python 3.14 pytest -q

  build:
    desc: Build the wheel and source distribution
    cmd: uv run --locked -- uv build --no-build-isolation --clear

  metadata-check:
    desc: Validate built distribution metadata
    cmd: uv run --locked twine check dist/*

  wheel-smoke:
    desc: Install the built wheel in isolation and smoke-test its import and CLI
    cmd: uv run --locked python scripts/wheel_smoke.py

  package-check:
    desc: Build and validate distributions, then smoke-test the installed wheel
    cmds:
      - task: build
      - task: metadata-check
      - task: wheel-smoke

  verify:
    desc: Run static checks, the Python matrix, and package verification
    cmds:
      - task: static
      - task: test-matrix
      - task: package-check
